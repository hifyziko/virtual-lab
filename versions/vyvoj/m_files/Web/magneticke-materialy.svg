<text x="44" y="18" text-anchor="middle" fill="#007c69" font-family="system-ui,sans-serif" font-size="9">rostoucí B ⊗</text>
<path d="M95 66H173M135 106V23" stroke="#6d858b" stroke-width="1.1" fill="none" marker-end="url(#materials-axis)"/>
