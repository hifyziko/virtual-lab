<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" role="img" aria-labelledby="materials-title materials-desc">
<title id="materials-title">Vířivé proudy a hystereze</title>
<desc id="materials-desc">Čelní řez vodivým železem: rostoucí indukce do roviny obrázku, značená křížkem, vyvolává uzavřené vířivé proudy proti směru hodinových ručiček. Vpravo hysterezní smyčka B–H se směrovými šipkami.</desc>
<defs>
<linearGradient id="materials-metal" x2="1" y2="1"><stop stop-color="#ecf2f2"/><stop offset="1" stop-color="#a9bfc4"/></linearGradient>
<marker id="materials-current" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#b76b2b"/></marker>
<marker id="materials-hysteresis" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#b34e38"/></marker>
<marker id="materials-axis" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#6d858b" stroke-width="1.2"/></marker>
</defs>
<!-- A solid conducting cross-section, not loops across insulated laminations. -->
