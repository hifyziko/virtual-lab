<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Úsporný rozběh · pole FEM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf3f2;color:#19313b;font:15px system-ui}main{padding:10px;max-width:1500px;margin:auto}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:white;border:1px solid #d9e2e1;border-radius:12px}button,select{font:inherit;border:1px solid #bacfc9;border-radius:7px;background:white;color:#19313b;padding:7px 12px}#play{background:#007e6c;color:white;min-width:110px}label{display:flex;gap:7px;align-items:center}input{accent-color:#007e6c}header label:first-of-type{flex:1}#time{width:100%;min-width:110px}output{font-variant-numeric:tabular-nums;white-space:nowrap}.views{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:12px}.pane{min-width:0;background:white;border:1px solid #d9e2e1;border-radius:12px;padding:10px}.pane h2{font-size:15px;margin:0 0 6px;display:flex;align-items:center;justify-content:space-between}.zoom-tag{font-size:11px;color:#925200;background:#fff3db;border:1px solid #dfb56f;border-radius:5px;padding:1px 6px;margin-right:4px}canvas{display:block;width:100%;aspect-ratio:1;touch-action:none}#whole{cursor:crosshair}#guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.foot{display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:#60747b;font-size:12px;margin-top:10px}.scale{display:inline-block;width:120px;height:10px;background:linear-gradient(90deg,#00f,#00bfff,#00df80,#ff0,#ff8000,#f00);border-radius:3px}#status{min-height:18px}.note{font-size:12px;color:#60747b;margin:8px 0}@media(min-width:900px){.views{max-height:calc(100dvh - 160px)}canvas{max-height:calc(100dvh - 210px)}}@media(max-width:650px){.views{grid-template-columns:1fr;gap:12px}#guide{display:none}header{gap:8px}.pane{padding:7px}}</style>
<main><header><button id="play" disabled>Přehrát</button><label>Čas <input id="time" type="range" min="0" max="1500" value="0"></label><output id="readout"></output><label>Detail <select id="zoom"><option value="3">3×</option><option value="5" selected>5×</option><option value="8">8×</option><option value="12">12×</option></select></label></header><section class="views"><div class="pane"><h2>Celé pole <span id="zoomTag" class="zoom-tag">Výřez 5×</span></h2><canvas id="whole" aria-label="Celé pole; tažením přesuňte rámeček detailu"></canvas></div><div class="pane"><h2>Detail vzduchové mezery</h2><canvas id="detail" aria-label="Zvětšený výřez pole ve stejném okamžiku"></canvas></div><svg id="guide"><defs><marker id="detailArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a34b00"/></marker></defs><path class="guide-halo" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/><path class="guide-line" fill="none" stroke="#a34b00" stroke-width="2.3" stroke-linecap="round" marker-end="url(#detailArrow)"/></svg></section><div class="foot"><span class="scale"></span><span id="scales"></span><span id="status">Načítání dat…</span></div><p class="note">Posuňte rámeček v celém poli. Obě okna zobrazují stejná data FEM. Rozběh 0–120 ms, krok 0,2 ms; přehrávání je zpomalené. Exportní mřížka 0,70 mm — přiblížení nepřidává prostorové rozlišení.</p></main><script src="manifest.js"></script><script src="viewer-canvas.js"></script></html>
